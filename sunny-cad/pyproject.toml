[project]
name = "sunny-cad"
version = "0.1.0"
description = "Diseño 3D y planos para sistemas solares residenciales con almacenamiento (proyecto Sunny)"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.26",
    "ezdxf>=1.4",
    "shapely>=2.2",
    "pillow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.2", "ruff>=0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Plantillas de texto de la memoria de cálculo
"engine/electrico/__main__.py" = ["E501"]
