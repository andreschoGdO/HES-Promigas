new GLTFLoader().parse(bin.buffer, "", gltf => {
  escena.add(gltf.scene);
  const caja = new THREE.Box3().setFromObject(gltf.scene);
  const centro = caja.getCenter(new THREE.Vector3());
  const tam = caja.getSize(new THREE.Vector3()).length();
  controles.target.copy(centro);
  camara.position.copy(centro).add(new THREE.Vector3(0.3 * tam, 0.7 * tam, 0.8 * tam));
  controles.update();
  escena.add(new THREE.GridHelper(Math.ceil(tam * 1.5), Math.ceil(tam * 1.5), 0x99a, 0xbbc));
});

const ray = new THREE.Raycaster(), puntero = new THREE.Vector2();
render.domElement.addEventListener("click", ev => {
  puntero.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(puntero, camara);
  const hit = ray.intersectObjects(escena.children, true)[0];
  document.getElementById("sel").textContent = hit ? hit.object.name : "";
});
addEventListener("resize", () => {
  camara.aspect = innerWidth / innerHeight; camara.updateProjectionMatrix();
  render.setSize(innerWidth, innerHeight);
});
(function animar() { requestAnimationFrame(animar); render.render(escena, camara); })();
